project:
  type: website
  output-dir: _site

website:
  title: "uSort-M"
  description: "Rapid and low-cost parsed protein library generation"
  favicon: images/Thumbnail.png
  
  navbar:
    logo: images/Thumbnail.png
    left:
      - text: Home
        href: index.qmd
      - text: Getting Started
        href: getting-started.qmd
      - text: Workflow
        menu:
          - text: Overview
            href: workflow/index.qmd
          - text: Library Design
            href: workflow/design.qmd
          - text: Sorting
            href: workflow/sorting.qmd
          - text: Barcoding
            href: workflow/barcoding.qmd
          - text: Demultiplexing
            href: workflow/demux.qmd
      - text: Tools
        menu:
          - text: Cost Calculator
            href: tools/cost-calculator.qmd
          - text: Coverage Explorer
            href: tools/coverage-explorer.qmd
      - text: CLI Reference
        href: cli-reference.qmd
    right:
      - icon: github
        href: https://github.com/FordyceLab/usortm

  page-footer:
    left: |
      uSort-M is developed by the [Fordyce Lab](https://fordycelab.stanford.edu) at Stanford University.
    right: |
      Built with [Quarto](https://quarto.org)

format:
  html:
    theme:
      light: [flatly, custom.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
