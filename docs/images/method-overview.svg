<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="180" fill="#fafafa" rx="8"/>
  
  <!-- Step 1: Pooled Library -->
  <g transform="translate(30, 30)">
    <rect width="120" height="100" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#1e40af">Pooled</text>
    <text x="60" y="68" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#1e40af">Library</text>
    <!-- Tube icon -->
    <path d="M50 75 L50 95 Q50 105 60 105 Q70 105 70 95 L70 75 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="60" cy="75" rx="10" ry="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="90" y="150" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">Oligo Pool</text>
  
  <!-- Arrow 1 -->
  <line x1="160" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: FACS -->
  <g transform="translate(210, 30)">
    <rect width="120" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#92400e">FACS</text>
    <text x="60" y="68" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#92400e">Sorting</text>
    <!-- Cell icons -->
    <circle cx="45" cy="90" r="6" fill="#fcd34d"/>
    <circle cx="60" cy="85" r="6" fill="#a3e635"/>
    <circle cx="75" cy="90" r="6" fill="#f87171"/>
  </g>
  <text x="270" y="150" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">Single-cell isolation</text>
  
  <!-- Arrow 2 -->
  <line x1="340" y1="80" x2="380" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: 384-well plate -->
  <g transform="translate(390, 30)">
    <rect width="120" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#166534">Barcoding</text>
    <!-- Plate grid -->
    <g transform="translate(25, 50)">
      <rect width="70" height="45" rx="2" fill="#f0fdf4" stroke="#16a34a"/>
      <g fill="#86efac">
        <rect x="5" y="5" width="8" height="8" rx="4"/>
        <rect x="17" y="5" width="8" height="8" rx="4"/>
        <rect x="29" y="5" width="8" height="8" rx="4"/>
        <rect x="41" y="5" width="8" height="8" rx="4"/>
        <rect x="53" y="5" width="8" height="8" rx="4"/>
        <rect x="5" y="17" width="8" height="8" rx="4"/>
        <rect x="17" y="17" width="8" height="8" rx="4"/>
        <rect x="29" y="17" width="8" height="8" rx="4"/>
        <rect x="41" y="17" width="8" height="8" rx="4"/>
        <rect x="53" y="17" width="8" height="8" rx="4"/>
        <rect x="5" y="29" width="8" height="8" rx="4"/>
        <rect x="17" y="29" width="8" height="8" rx="4"/>
        <rect x="29" y="29" width="8" height="8" rx="4"/>
        <rect x="41" y="29" width="8" height="8" rx="4"/>
        <rect x="53" y="29" width="8" height="8" rx="4"/>
      </g>
    </g>
  </g>
  <text x="450" y="150" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">Well-specific barcodes</text>
  
  <!-- Arrow 3 -->
  <line x1="520" y1="80" x2="560" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Sequencing -->
  <g transform="translate(570, 30)">
    <rect width="120" height="100" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#6b21a8">Sequencing</text>
    <text x="60" y="68" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#6b21a8">+ Analysis</text>
    <!-- DNA helix icon -->
    <path d="M45 80 Q60 90 75 80 Q60 70 45 80" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M45 90 Q60 100 75 90 Q60 80 45 90" fill="none" stroke="#c084fc" stroke-width="2"/>
  </g>
  <text x="630" y="150" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">Demultiplexing</text>
  
  <!-- Arrow 4 -->
  <line x1="700" y1="80" x2="740" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Arrayed Library -->
  <g transform="translate(750, 30)">
    <rect width="120" height="100" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#1e40af">Arrayed</text>
    <text x="60" y="56" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#1e40af">Library</text>
    <!-- Verified plate -->
    <g transform="translate(25, 60)">
      <rect width="70" height="35" rx="2" fill="#dbeafe" stroke="#2563eb"/>
      <g>
        <rect x="5" y="5" width="10" height="10" rx="2" fill="#3b82f6"/>
        <rect x="19" y="5" width="10" height="10" rx="2" fill="#22c55e"/>
        <rect x="33" y="5" width="10" height="10" rx="2" fill="#f97316"/>
        <rect x="47" y="5" width="10" height="10" rx="2" fill="#a855f7"/>
        <rect x="5" y="19" width="10" height="10" rx="2" fill="#ef4444"/>
        <rect x="19" y="19" width="10" height="10" rx="2" fill="#eab308"/>
        <rect x="33" y="19" width="10" height="10" rx="2" fill="#06b6d4"/>
        <rect x="47" y="19" width="10" height="10" rx="2" fill="#ec4899"/>
      </g>
    </g>
  </g>
  <text x="810" y="150" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748b">Verified clones</text>
</svg>
