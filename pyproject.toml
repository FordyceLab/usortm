[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usortm"
version = "0.1.0"
description = "Utilities for rapid and low-cost parsed protein library generation."
authors = [
    {name = "Micah Olivas", email = "mbolivas@stanford.edu"},
    {name = "Patrick Almhjell", email = "almhjell@stanford.edu"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "typer[all]>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
viz = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "bokeh>=3.0",
]
demux = [
    "biopython>=1.80",
    "bionumpy>=1.0",
    "pysam>=0.20",
    "tqdm>=4.60",
    "tomli>=1.0; python_version < '3.11'",
]
all = [
    "usortm[dev,viz,demux]",
]

[project.scripts]
usortm = "usortm.cli:app"

[project.urls]
Homepage = "https://github.com/FordyceLab/usortm"
Repository = "https://github.com/FordyceLab/usortm"
Documentation = "https://fordycelab.github.io/usortm"

[tool.setuptools.packages.find]
where = ["src"]
include = ["usortm*"]
